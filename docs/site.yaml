findings:
  - title: Knowledge and application differ
    body: Every system scores higher on Theory than Case.
  - title: Category profiles matter
    body: 'The useful application-facing conclusion is the profile of limits, not the name of a winner.'
  - title: Configuration gains depend on the task
    body: Both Theory contrasts are positive and detected, yet neither system shows a correspondingly detected positive Case difference.
limitations: |
  **Representation and validation.** The model-generated, model-verified key lacks comprehensive expert adjudication. Contested school conventions, incomplete public item provenance, concentrated Case sources, and unknown contamination limit interpretation. Scores measure agreement with this representation, not metaphysical truth, predictive validity, or general cultural competence. Applications involving consequential real-world decisions are outside the supported scope.

  **Selection and statistical scope.** Final items were selected using the evaluated panel, not held out independently. Categories and Case tags are observational groupings; source and chart reuse remain unmodeled. Point estimates and nominal intervals do not establish population-level category effects. Shared generation/evaluation model families and single runs at temperature zero add uncertainty.

  **Endpoint limitations.** Mixed routes, missing immutable snapshots, and configuration offsets restrict capability and efficiency comparisons.
