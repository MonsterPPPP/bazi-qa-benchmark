<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{page_title}}</title>

  <!-- Primary Meta Tags -->
  <meta name="title" content="{{title}}">
  <meta name="description" content="{{description}}">
  <meta name="keywords" content="{{keywords}}">
  <meta name="author" content="{{authors_meta}}">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="{{brand_color}}">

  <!-- Open Graph -->
  <meta property="og:type" content="article">
  <meta property="og:site_name" content="{{title}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{base_url}}/{{page_path}}">
  <meta property="og:image" content="{{base_url}}/{{og_image}}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{title}}">
  <meta property="article:published_time" content="{{date}}T00:00:00.000Z">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{title}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{base_url}}/{{og_image}}">

  <!-- Academic / citation -->
  <meta name="citation_title" content="{{title}}">
{{citation_authors}}
  <meta name="citation_publication_date" content="{{year}}">
  <meta name="citation_conference_title" content="{{venue}}">
  <meta name="citation_pdf_url" content="{{paper_url}}">

  <link rel="icon" href="static/favicon.svg" type="image/svg+xml">

  <!-- 站点内资源一律用相对路径：本地预览、子路径部署、自定义域名都不需要改配置。
       base_url 只用于 meta / OG / citation 这类必须给绝对地址的地方。 -->
  <link rel="stylesheet" href="static/css/site.css">
  <link rel="stylesheet" href="static/vendor/tabulator/tabulator.min.css">

  <!-- 机器可读：搜索引擎与学术索引读这段 JSON-LD -->
  <script type="application/ld+json">
{{jsonld}}
  </script>
</head>
<body class="{{body_class}}">

  <main id="main-content">
%%SECTIONS%%
  </main>

  <script src="static/vendor/tabulator/tabulator.min.js" defer></script>
  <script src="static/js/site.js" defer></script>
{{page_scripts}}
</body>
</html>
